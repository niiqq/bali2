name: scheduled

on:
  schedule:
    # Hourly, at minute 7. GitHub drops scheduled runs that land on
    # congested minutes, and :00 is the busiest slot on the shared queue.
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: scheduled
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bali2
    steps:
      - uses: actions/checkout@v5

      - name: Probe
        id: probe
        env:
          CONFIG: ${{ secrets.CONFIG }}
        run: python3 main.py

      - name: Flag
        # always() so a hit is still reported even when another entry
        # failed and turned the Probe step red. The script writes its
        # outputs before it exits, so they are available either way.
        if: always() && steps.probe.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for index in $(jq -r '.[]' hits.json); do
            title="Item $index requires attention"

            existing=$(gh issue list --state open --limit 100 --json title \
                        | jq --arg t "$title" '[.[] | select(.title == $t)] | length')
            if [ "$existing" != "0" ]; then
              echo "[$index] already open"
              continue
            fi

            gh issue create --title "$title" --assignee "$OWNER" \
              --body "The scheduled check flagged item $index. Close this issue to reset it."
            echo "[$index] flagged"
          done
